services:
  - type: web
    name: reboot-us
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    preDeployCommand: flask --app app:create_app setup-db
    startCommand: gunicorn 'app:create_app()' --bind 0.0.0.0:$PORT --workers 2 --access-logfile -
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: reboot-db
          property: connectionString
      - key: COOKIE_SECURE
        value: '1'
      - key: SEED_DUMMY_DATA
        value: '1'
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CUSTOMER_EMAIL
        sync: false
      - key: CUSTOMER_PASSWORD
        sync: false
      - key: SITE_URL
        sync: false
databases:
  - name: reboot-db
    plan: 0.1c-256mb
    diskSizeGB: 1
    ipAllowList: []
